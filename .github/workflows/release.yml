name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: take-note_linux_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: take-note_linux_aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: take-note_darwin_x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: take-note_darwin_aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: take-note_windows_x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build binary
        run: |
          deno compile \
            --no-check \
            --target ${{ matrix.target }} \
            --output ${{ matrix.asset_name }} \
            --allow-run \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-sys \
            take-note.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
